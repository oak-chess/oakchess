*{box-sizing:border-box}body{margin:0;background:#090e17;color:#edf1fb;font:13px/1.5 Arial,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}header{position:fixed;top:24px;left:28px;pointer-events:none;max-width:260px}header small{color:#ff697f;font-size:9px;font-weight:700;letter-spacing:2.5px}h1{font-size:28px;line-height:1.1;margin:9px 0}header p{font-size:12px;color:#96a6bf;margin:0}header span{display:inline-block;margin-top:12px;padding:4px 8px;border:1px solid #4d5a70;border-radius:20px;font-size:9px;color:#b8c7df;background:#101824b0}.toolbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;width:max-content;max-width:calc(100% - 24px)}button{font:600 11px Arial;color:#c9d5e9;background:#192536e8;border:1px solid #43516b;border-radius:7px;padding:10px 13px;cursor:pointer;min-height:36px}button:hover{border-color:#ef728c;color:white}button[aria-pressed=true]{background:#792c43;border-color:#e96580;color:white}button:focus-visible,input:focus-visible{outline:2px solid #ff91a7;outline-offset:3px}.hint{position:fixed;right:25px;top:25px;text-align:right;font-size:10px;color:#8e9db5;pointer-events:none}.hint b{display:block;color:#d6e0ee;font-size:11px}.status{position:fixed;left:28px;bottom:27px;color:#adbed8;font-size:11px;pointer-events:none}.status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ed5578;margin-right:7px}audio{display:none}@media(max-width:700px){header{top:14px;left:14px;max-width:190px}h1{font-size:21px}header p,.hint,.status{display:none}.toolbar{bottom:12px;gap:6px}button{padding:9px;font-size:10px}}
