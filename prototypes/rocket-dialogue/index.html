<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operação Rocket · Protótipo de diálogos</title><link rel="stylesheet" href="style.css?v=6"></head><body>
<iframe class="arena" src="../rocket-arena/index.html?backdrop=1" title="Cenário da base Rocket" tabindex="-1" aria-hidden="true"></iframe><div class="shade"></div>
<header class="prototype"><div><small>OAKCHESS · PROTÓTIPO</small><strong>Diálogos da Operação Rocket</strong></div><nav aria-label="Escolher tela"><button data-scene="officer">Oficial</button><button data-scene="duo">Jessie e James</button><button data-scene="rescue">Resgate</button><button data-scene="terminal">Terminal</button><button data-scene="victory">Vitória</button><label class="stage-picker"><span>Outras etapas</span><select id="stage-select" aria-label="Escolher outra etapa"><option value="">Todas as etapas…</option></select></label></nav></header>
<main><section class="mission" aria-label="Estado da operação"><span class="rocket-r">R</span><div><small>OPERAÇÃO ROCKET / CELADON</small><b id="location">Setor de contenção</b></div><dl><div><dt>Etapa</dt><dd>18<span>/50</span></dd></div><div><dt>Vida</dt><dd>100</dd></div><div><dt>Ouro</dt><dd>14</dd></div><div><dt>Alerta</dt><dd class="alert">● ● <span>○ ○</span></dd></div></dl></section>
<button id="peek" aria-pressed="false">◉ Ver tabuleiro <kbd>V</kbd></button>
<section class="encounter" aria-label="Personagem do encontro"><div class="scene-label"><span id="kind">ENCONTRO / OFICIAL</span><h1 id="heading">Passagem bloqueada</h1></div><div class="character" id="character"></div><div class="character-shadow"></div><div class="reward" id="reward"></div></section>
<section class="conversation" aria-label="Diálogo e escolhas"><div class="dialogue"><div class="nameplate" id="speaker">ARCHER</div><button class="dialogue-text" id="advance" aria-label="Avançar diálogo"><span id="text"></span><span class="continue" aria-hidden="true">▼</span></button><div class="dialogue-foot"><span id="page">DIÁLOGO 1 / 2</span><span><kbd>Espaço</kbd> avançar</span></div></div><nav class="choices" id="choices" aria-label="O que deseja fazer?"></nav></section>
<footer class="help"><span><kbd>↑</kbd><kbd>↓</kbd> escolher · <kbd>Enter</kbd> confirmar</span><span id="feedback" role="status">Protótipo independente · não altera sua partida</span><button id="effects" aria-pressed="true">♪ Efeitos ligados</button><button id="sound" aria-pressed="false">♫ Música desligada</button></footer>
</main><audio id="music" src="../../assets/music/rocket-hideout.mp3" preload="none" loop></audio><script src="stages.js?v=2"></script><script src="effects.js?v=1"></script><script src="dialogue.js?v=3"></script></body></html>
